name: Offline regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: Full pytest and corpus validation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up validated Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Set up validated Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"

      - name: Install pinned Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Verify historical Git objects
        run: |
          git cat-file -e '3c0a5fbc25d7434cf4c80de27aae16fc8761a921^{commit}'
          git cat-file -e 'c589f61b628b787251410964ed50a0fe696a4038^{commit}'

      - name: Restore authenticated historical fixtures offline
        run: python scripts/restore_historical_test_fixtures.py

      - name: Check all 117 restored fixtures
        run: python scripts/restore_historical_test_fixtures.py --check

      - name: Run the complete regression suite
        run: |
          mkdir -p ci-results
          python -m pytest -q tests --junitxml=ci-results/pytest.xml

      - name: Validate authoritative and public data
        run: |
          python scripts/validate_curated_database.py
          python scripts/validate_public_preview.py

      - name: Confirm corpus and frontend are unchanged
        if: always()
        run: |
          git diff --exit-code -- data/ web/
          git diff --cached --exit-code -- data/ web/

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14
